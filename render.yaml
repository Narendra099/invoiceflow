# Render Blueprint — one service that builds & serves both the API and the React app.
# Deploy: push this repo to GitHub, then in Render click "New +" -> "Blueprint" and pick the repo.
services:
  - type: web
    name: invoiceflow
    runtime: node
    plan: free
    buildCommand: npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      # Uncomment + add a persistent disk below if you want invoice data to survive restarts.
      # - key: DB_PATH
      #   value: /data/invoiceflow.db
    # Free tier uses an ephemeral filesystem (demo data resets on redeploy).
    # For persistent data, upgrade and attach a disk:
    # disk:
    #   name: invoiceflow-data
    #   mountPath: /data
    #   sizeGB: 1
